name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q -m "not slow"
      - name: The check a participant runs
        run: python -m investment_sandbox check
      - name: The notebook, end to end
        if: matrix.python-version == '3.12'
        run: pytest -q -m slow

  wheel:
    # The package must be complete away from the repository: the data tables ship
    # inside it, so an install into an empty directory has to run on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel elsewhere
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -m investment_sandbox check
